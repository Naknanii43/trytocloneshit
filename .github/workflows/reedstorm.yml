name: Build Reedstorm

on:
  push:
    paths: [ "SaxRack/**", ".github/workflows/reedstorm.yml" ]
  pull_request:
    paths: [ "SaxRack/**", ".github/workflows/reedstorm.yml" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: SaxRack
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev ninja-build

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DREEDSTORM_BUILD_TESTS=ON
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DREEDSTORM_BUILD_TESTS=ON
          fi

      - name: Build plugin
        run: cmake --build build --config Release --target Reedstorm_VST3 Reedstorm_Standalone --parallel 2

      - name: Build AU (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --target Reedstorm_AU --parallel 2

      - name: Build test tool (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --config Release --target ReedstormRenderTest --parallel 2

      - name: Tests (tracker, harmony, octaver, all presets, UI)
        if: runner.os == 'Linux'
        run: ./build/ReedstormRenderTest_artefacts/Release/ReedstormRenderTest render-out

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Reedstorm-${{ runner.os }}
          path: |
            SaxRack/build/Reedstorm_artefacts/Release/VST3
            SaxRack/build/Reedstorm_artefacts/Release/AU
            SaxRack/build/Reedstorm_artefacts/Release/Standalone
